name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: node
      - run: npm ci
      - run: npm run lint:md
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml .
          lycheeVersion: v0.24.2
  opencode-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate opencode.json
        run: >-
          pipx run check-jsonschema
          --schemafile https://opencode.ai/config.json
          opencode.json
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate schemas
        run: pipx run check-jsonschema --check-metaschema schemas/*.schema.json
      - name: Validate examples
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/work-item.schema.json
          examples/work-item.example.yaml
      - name: Validate role contract example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/role-contract.schema.json
          examples/role-contract.example.yaml
      - name: Validate policy decision example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/policy-decision.schema.json
          examples/policy-decision.example.yaml
      - name: Validate evidence manifest example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/evidence-manifest.schema.json
          examples/evidence-manifest.example.yaml
      - name: Validate evidence example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/evidence.schema.json
          examples/evidence.example.yaml
      - name: Validate run state example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/run-state.schema.json
          examples/run-state.example.yaml
      - name: Validate handoff example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/handoff.schema.json
          examples/handoff.example.yaml
      - name: Validate test integrity example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/test-integrity-report.schema.json
          examples/test-integrity-report.example.yaml
      - name: Validate review record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/review-record.schema.json
          examples/review-record.example.yaml
      - name: Validate acceptance record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/acceptance-record.schema.json
          examples/acceptance-record.example.yaml
      - name: Validate release record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/release-record.schema.json
          examples/release-record.example.yaml
      - name: Validate trace event example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/trace-event.schema.json
          examples/trace-event.example.yaml
      - name: Validate provenance record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/provenance-record.schema.json
          examples/provenance-record.example.yaml
      - name: Validate evaluation record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/evaluation-record.schema.json
          examples/evaluation-record.example.yaml
      - name: Validate incident record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/incident-record.schema.json
          examples/incident-record.example.yaml
      - name: Validate mycelia config example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/mycelia.schema.json
          examples/mycelia.example.yaml
      - name: Validate readiness report example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/readiness-report.schema.json
          examples/readiness-report.example.yaml
      - name: Validate conformance result example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/conformance-result.schema.json
          examples/conformance-result.example.yaml
      - name: Validate idempotency record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/idempotency-record.schema.json
          examples/idempotency-record.example.yaml
      - name: Validate budget ledger example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/budget-ledger.schema.json
          examples/budget-ledger.example.yaml
      - name: Validate kill switch record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/kill-switch-record.schema.json
          examples/kill-switch-record.example.yaml
      - name: Validate notification record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/notification-record.schema.json
          examples/notification-record.example.yaml
      - name: Validate owner answer record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/owner-answer-record.schema.json
          examples/owner-answer-record.example.yaml
      - name: Validate reply record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/reply-record.schema.json
          examples/reply-record.example.yaml
      - name: Validate work cycle record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/work-cycle-record.schema.json
          examples/work-cycle-record.example.yaml
      - name: Validate recorded decision example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/recorded-decision.schema.json
          examples/recorded-decision.example.yaml
      - name: Validate configuration defect example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/configuration-defect.schema.json
          examples/configuration-defect.example.yaml
      - name: Validate gap record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/gap-record.schema.json
          examples/gap-record.example.yaml
      - name: Validate load check record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/load-check-record.schema.json
          examples/load-check-record.example.yaml
      - name: Validate runtime environment record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/runtime-environment-record.schema.json
          examples/runtime-environment-record.example.yaml
      - name: Validate selection map defect example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/selection-map-defect.schema.json
          examples/selection-map-defect.example.yaml
      - name: Validate update record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/update-record.schema.json
          examples/update-record.example.yaml
      - name: Validate carried result example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/carried-result.schema.json
          examples/carried-result.example.yaml
      - name: Validate dependency tier record example
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/dependency-tier-record.schema.json
          examples/dependency-tier-record.example.yaml
      - name: Validate conformance fixtures
        run: >-
          pipx run check-jsonschema
          --schemafile schemas/conformance-fixture.schema.json
          conformance/fixtures/*.yaml
      - name: Check fixture names
        run: bash scripts/check-fixture-names.sh
      - name: Validate worked example records
        run: bash scripts/check-worked-example.sh
  # ci-ok is the one required check: add every job above to its needs.
  ci-ok:
    if: always()
    needs: [actionlint, markdownlint, links, opencode-config, schemas]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
