apiVersion: mycelia/v1
kind: MyceliaConfig
metadata:
  name: mycelia
  repository: yutna/mycelia
  createdAt: 2026-11-13T09:00:00Z
  owner: yutna
spec:
  profile: standard
  autonomy:
    ceiling: L2
    default: L1
  runtime:
    name: opencode
    version: 2.4.2
    config: opencode.json
    heartbeatInterval: PT1M
    staleRunThreshold: PT10M
    acknowledgementExpiry: P1D
    supervisorTimeout: PT30S
    notificationAdapter: github-issue-comment
    escalationChain:
      - owner
      - maintainer
    noProgressLimit: 3
    recordedDecisionLimit: 2
    protectedPaths:
      - "conformance/**"
    maxBaseUpdates: 3
    maxBranchAge: P7D
  verification:
    fastGateTarget: PT5M
    fastGateOverruns:
      count: 3
      window: P7D
    fullGateSchedule: nightly
    fullGateFailuresBeforeCeiling: 3
    maxFullGateRuns: 3
    releaseBranchPattern: "release/*"
    selectionMap: .mycelia/selection-map.yaml
    skipRules:
      - name: docs-only
        paths:
          - "docs/**/*.md"
          - "*.md"
        skips:
          - unit
          - integration
          - mutation
        replacementEvidence:
          - lint
          - links
        approvedBy: owner
  dependencies:
    testOnlyPackages: []
    r3Packages:
      - "@auth/*"
      - pg
  rules:
    - id: RULE-001
      version: 1.0.0
      status: active
      owner: security-owner
      reviewDate: 2027-01-31
      enforcer:
        guard: opencode-policy
        rule: deny-force-push
    - id: RULE-002
      version: 1.0.0
      status: active
      owner: platform-owner
      reviewDate: 2027-01-31
      enforcer: instruction only
  riskTiers:
    R0: Documentation, comments, formatting.
    R1: Tests, internal tooling, non-production scripts.
    R2: Normal feature or bug fix.
    R3: Auth, payments, data schema, infrastructure, security configuration.
    R4: Production credentials, destructive migrations, incident response.
  evidenceManifest: examples/evidence-manifest.example.yaml
  roles:
    - planner
    - implementer
    - verifier
    - reviewer
    - integrator
    - assessor
  policies:
    - opencode.json
  budgets:
    maxCostUSD: 20
    maxTokens: 2000000
    maxSteps: 30
    maxConcurrency: 4
  observability:
    traceSink: trace/
    retentionDays: 90
  dataClasses:
    - public
    - internal
