apiVersion: mycelia/v1
kind: ConformanceFixture
metadata:
  id: kill-switch
  title: The kill switch stops runs and survives a restart
spec:
  requirements: [MYC-EXE-008]
  profiles: [standard, high-assurance]
  description: Engage the kill switch mid-run, then restart the runtime and try to start a run.
  cases:
    - id: engaged-mid-run
      given:
        workItem: { riskTier: R2 }
      when:
        - step: start-run
        - step: engage-kill-switch
      expect:
        terminalState: aborted
        runExitCode: 1
        evidence: [KillSwitchRecord, RunState, TraceEvent]
    - id: no-start-after-restart
      given:
        workItem: { riskTier: R2 }
        runtime: { killSwitch: engaged }
      when:
        - step: restart-runtime
        - step: start-run
      expect:
        terminalState: none
        runExitCode: 1
        evidence: [KillSwitchRecord, TraceEvent]
        absent: [a new run starting while the switch is engaged]
