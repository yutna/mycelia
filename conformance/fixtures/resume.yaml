        absent: [duplicate branch, duplicate pull request, duplicate comment]
    - id: stop-in-verifying
      given:
        workItem: { riskTier: R2 }
      when:
        - step: start-run
        - step: stop-runner
          with: { inState: verifying }
        - step: restart-runtime
        - step: reach-terminal-state
          with: { gates: all-pass }
      expect:
        terminalState: accepted
        runExitCode: 0
        stateAfter: verifying
        evidence: [RunState, TraceEvent, IdempotencyRecord]
        absent: [duplicate branch, duplicate pull request, duplicate comment]
    - id: stop-in-reviewing
      given:
        workItem: { riskTier: R2 }
      when:
        - step: start-run
        - step: stop-runner
          with: { inState: reviewing }
        - step: restart-runtime
        - step: reach-terminal-state
          with: { gates: all-pass }
      expect:
