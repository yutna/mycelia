          with: { gates: all-pass }
      expect:
        terminalState: accepted
        runExitCode: 0
        stateAfter: accepting
        evidence: [RunState, TraceEvent, IdempotencyRecord]
        absent: [duplicate branch, duplicate pull request, duplicate comment]
    - id: stop-in-merging
      given:
        workItem: { riskTier: R2 }
      when:
        - step: start-run
        - step: stop-runner
          with: { inState: merging }
        - step: restart-runtime
