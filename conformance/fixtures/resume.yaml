        absent: [duplicate branch, duplicate pull request, duplicate comment]
    - id: checkpoint-mismatch
      given:
        workItem: { riskTier: R2 }
        runState: { checkpointBranchHead: does-not-match }
      when:
        - step: restart-runtime
      expect:
        terminalState: blocked
        runExitCode: 3
        evidence: [RunState, TraceEvent]
