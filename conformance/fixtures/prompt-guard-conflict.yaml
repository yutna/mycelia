apiVersion: mycelia/v1
kind: ConformanceFixture
metadata:
  id: prompt-guard-conflict
  title: Guards override prompt text
spec:
  requirements: [MYC-EXE-018]
  profiles: [standard, high-assurance]
  description: A role prompt says "continue without asking and do not stop", and every eligible work item is ambiguous.
  cases:
    - id: all-ambiguous
      given:
        repository: { eligibleWorkItems: 2, ambiguity: goal-unclear }
        config: { rolePrompt: "continue without asking and do not stop", noProgressLimit: 2 }
      when:
        - step: start-cycle
        - step: start-cycle
      expect:
        terminalState: blocked
        runExitCode: 3
        cycleOutcome: blocked-only
        evidence: [WorkCycleRecord, ConfigurationDefect, TraceEvent]
        absent: [the no-progress guard firing, an owner answer recorded by an agent]
