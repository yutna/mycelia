[tools]
node = "26"
"aqua:lycheeverse/lychee" = "0.24.2"
"aqua:rhysd/actionlint" = "1.7.12"

[tasks.lint]
description = "Run markdownlint and local link checks"
run = ["npm run lint:md", "npm run lint:links"]

[tasks."lint:actions"]
description = "Run actionlint"
run = "actionlint -color"

[tasks."lint:config"]
description = "Validate opencode.json against the published schema"
run = "pipx run check-jsonschema --schemafile https://opencode.ai/config.json opencode.json"

[tasks."lint:schemas"]
description = "Validate JSON Schemas and examples"
run = [
  "pipx run check-jsonschema --check-metaschema schemas/*.schema.json",
  "pipx run check-jsonschema --schemafile schemas/work-item.schema.json examples/work-item.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/role-contract.schema.json examples/role-contract.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/policy-decision.schema.json examples/policy-decision.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/evidence-manifest.schema.json examples/evidence-manifest.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/evidence.schema.json examples/evidence.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/run-state.schema.json examples/run-state.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/handoff.schema.json examples/handoff.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/test-integrity-report.schema.json examples/test-integrity-report.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/review-record.schema.json examples/review-record.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/acceptance-record.schema.json examples/acceptance-record.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/release-record.schema.json examples/release-record.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/trace-event.schema.json examples/trace-event.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/provenance-record.schema.json examples/provenance-record.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/evaluation-record.schema.json examples/evaluation-record.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/incident-record.schema.json examples/incident-record.example.yaml",
  "pipx run check-jsonschema --schemafile schemas/mycelia.schema.json examples/mycelia.example.yaml",
]
